# nginx.conf — production static-file server for office.hostname.com.
#
# Sets COOP/COEP headers required for SharedArrayBuffer (HarfBuzz, x2t WASM).
# No SPA fallback — unknown URLs return 404 (the editor expects this).

worker_processes auto;
events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;

  # Add WASM type if not in default mime.types.
  types {
    application/wasm  wasm;
  }

  sendfile          on;
  tcp_nopush        on;
  keepalive_timeout 65;

  # Pre-built compression: serve .br / .gz if browser accepts and file exists.
  gzip_static  on;
  # brotli_static on;   # uncomment if your nginx variant has the brotli_static module

  # Suppress version disclosure.
  server_tokens off;

  # Define a map for COEP — only set on responses that need it.
  # All editor responses need it; this keeps things simple.
  map $sent_http_content_type $coop {
    default                          "same-origin";
  }

  server {
    listen      80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index edit.html;

    # NOTE on COOP/COEP — DO NOT enable Cross-Origin-Opener-Policy
    # 'same-origin' here. It severs window.opener for cross-origin
    # popups (which is exactly our deployment shape: main app at
    # app.* opens editor at office.* via window.open). Without
    # window.opener, postMessage between main app and editor breaks.
    #
    # HarfBuzz + x2t WASM are single-threaded — they don't need
    # SharedArrayBuffer (which is what COOP same-origin would unlock).
    # Plain ArrayBuffer is sufficient for our use case.
    #
    # If multi-threaded WASM is ever introduced, embed the editor as
    # an iframe (COOP doesn't break parent/child postMessage) instead
    # of a popup.

    # Permissive CORS so app.hostname.com (different origin) can fetch
    # fonts / wasm directly if needed.
    add_header Access-Control-Allow-Origin  "*" always;

    # Don't index this site (it's a tool, not content).
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Hardening — minor stuff.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin" always;

    # ─── Caching policy ────────────────────────────────────────────
    # Vendor trees (sdkjs / web-apps / fonts / x2t) only change on a full
    # rebuild (OnlyOffice version bump) — cache them hard for fast editor opens.
    # CAVEAT: these URLs are NOT content-hashed, so on a version bump an already-
    # cached browser keeps the old copy until expiry. When you bump OnlyOffice,
    # either version the URLs (e.g. a ?v=<build> param) or have users hard-reload
    # once. (Day-to-day wrapper deploys are unaffected — see the glue rule below.)
    location ~* ^/(sdkjs|web-apps|fonts|x2t)/.*\.(js|wasm|woff2|woff|ttf|png|jpg|jpeg|gif|svg|ico|css)$ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header Access-Control-Allow-Origin  "*" always;
      try_files $uri =404;
    }

    # Our own wrapper glue (wrapper-*.js, editor-stubs.js, x2t-bridge.js,
    # edit.css, icons, …) has FIXED filenames at the site root, so it MUST
    # revalidate — otherwise a deploy never reaches an already-loaded browser
    # (the bug this replaces: it was `immutable`, so updates needed a hard
    # reload / cache clear). `no-cache` + nginx's automatic ETag/Last-Modified
    # → 304 when unchanged, 200 when a deploy changed the file, so updates land
    # on the next page load with no hard reload. This regex is reached only for
    # assets NOT matched by the vendor rule above (nginx tries regex locations
    # in order), i.e. the root-level glue.
    location ~* \.(js|wasm|woff2|woff|ttf|png|jpg|jpeg|gif|svg|ico|css)$ {
      add_header Cache-Control "no-cache" always;
      add_header Access-Control-Allow-Origin  "*" always;
      try_files $uri =404;
    }

    # HTML — never cache (so deploys propagate immediately).
    location ~* \.html$ {
      add_header Cache-Control "no-cache" always;
      add_header Access-Control-Allow-Origin  "*" always;
      try_files $uri =404;
    }

    # ─── Default location: NO SPA fallback ─────────────────────────
    # Unknown URLs return 404. The editor relies on this — its boot
    # path uses 404s as signals (e.g. ChartStyles.js missing → use
    # the empty stub we ship at the documented path).
    location / {
      try_files $uri =404;
    }
  }
}
